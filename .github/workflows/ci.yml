name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend legacy

      - name: Reject OpenRouter-looking secrets
        shell: bash
        run: |
          secret_prefix="sk-or-v1"
          if grep -RIE --exclude-dir=.git --exclude=ci.yml "${secret_prefix}-[[:alnum:]]{20,}" .; then
            echo "Potential OpenRouter secret found"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build -t posterflow-ai:${{ github.sha }} .
