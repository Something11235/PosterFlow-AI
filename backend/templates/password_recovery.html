<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>设置新密码 · PosterFlow AI</title>
  <style nonce="{{ nonce }}">
    :root { color-scheme: dark; font-family: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; background: #090d14; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; }
    main { width: 100%; max-width: 480px; }
    .brand { margin: 0 0 26px; color: #cbd5e1; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
    .card { padding: 36px 32px 32px; border: 1px solid #334155; border-radius: 20px; background: #0f1623; }
    .icon { width: 56px; height: 56px; margin-bottom: 24px; border-radius: 16px; display: grid; place-items: center; background: #173b76; color: #8bb5ff; }
    .icon svg { width: 26px; height: 26px; }
    #success-mark { display: none; }
    [data-state="success"] .icon { background: #0b3b35; color: #52e0b8; }
    [data-state="success"] #success-mark { display: block; }
    [data-state="success"] #lock { display: none; }
    .label { margin: 0 0 10px; color: #a7b4c8; font-size: 13px; }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 32px); line-height: 1.35; letter-spacing: -.025em; }
    .message { margin: 14px 0 24px; color: #cbd5e1; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
    label { display: block; margin: 20px 0 10px; color: #e2e8f0; font-size: 14px; }
    input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid #475569; border-radius: 10px; background: #090d14; color: #f8fafc; font: inherit; font-size: 16px; }
    .hint, .footnote { color: #a7b4c8; font-size: 13px; line-height: 1.7; }
    .hint { margin: 8px 0 0; }
    .footnote { margin: 20px 0 0; }
    button { min-height: 48px; padding: 12px 18px; border: 1px solid #4f86ff; border-radius: 10px; background: #4f86ff; color: #fff; font: inherit; font-size: 16px; cursor: pointer; }
    button:hover { background: #3975f2; }
    button:disabled { opacity: .65; cursor: wait; }
    #submit { width: 100%; margin-top: 24px; }
    #toggle { padding: 8px 0; background: transparent; border: none; color: #9cc0ff; font-size: 14px; }
    #error { margin: 20px 0 0; padding: 12px 14px; border: 1px solid #85404c; border-radius: 10px; background: #301d27; color: #ffb9bf; font-size: 14px; line-height: 1.7; }
    :focus-visible { outline: 3px solid #d6a84f; outline-offset: 4px; }
    [hidden] { display: none !important; }
    @media (max-width: 400px) { .card { padding: 28px 22px 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">PosterFlow AI</p>
    <section class="card" id="result" data-state="ready" aria-labelledby="title" aria-busy="false">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g id="lock"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></g>
          <path id="success-mark" d="m5 12 4 4L19 6"/>
        </svg>
      </div>
      <div role="status" aria-live="polite" aria-atomic="true">
        <p class="label">密码重置</p>
        <h1 id="title">设置新密码</h1>
        <p class="message" id="message">输入并确认新密码后，点击下方按钮完成修改。</p>
      </div>
      <form id="form" novalidate>
        <label for="password">新密码</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="hint error">
        <p class="hint" id="hint">8–128 位，支持字母、数字和特殊字符。</p>
        <label for="confirmation">确认新密码</label>
        <input id="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="error">
        <button id="toggle" type="button" aria-pressed="false">显示密码</button>
        <p id="error" role="alert" hidden></p>
        <button id="submit" type="submit">确认修改密码</button>
      </form>
      <noscript><p class="footnote">请使用支持 JavaScript 的系统浏览器打开邮件链接，才能设置新密码。</p></noscript>
    </section>
    <p class="footnote">如果在邮箱内无法打开，请选择“用系统浏览器打开”。</p>
  </main>
  <script nonce="{{ nonce }}">
    const params = new URLSearchParams(window.location.hash.slice(1));
    let tokenHash = params.get("token_hash") || "";
    let legacyToken = params.get("access_token") || "";
    const action = params.get("type");
    const linkError = params.has("error") || params.has("error_code");
    history.replaceState(null, "", window.location.pathname);
    window.addEventListener("hashchange", () => { if (window.location.hash) window.location.reload(); });
    const form = document.getElementById("form");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const confirmation = document.getElementById("confirmation");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");
    const toggle = document.getElementById("toggle");
    const result = document.getElementById("result");
    const hasProof = action === "recovery" && (/^[A-Za-z0-9_-]{32,256}$/.test(tokenHash) || /^[A-Za-z0-9_.-]{32,3072}$/.test(legacyToken));
    let verified = {{ recovery_ready | tojson }} && !tokenHash && !legacyToken && !linkError;
    let busy = false;

    function showError(text) { error.textContent = text; error.hidden = false; }
    function stop(heading, text) {
      title.textContent = heading;
      document.title = heading + " · PosterFlow AI";
      message.textContent = text;
      form.hidden = true;
    }
    if (linkError) stop("重置链接已失效", "链接已过期或已使用，请返回网站重新申请密码重置邮件。");
    else if (!hasProof && !verified) stop("重置链接不完整", "请从密码重置邮件中重新打开完整链接。");

    form.addEventListener("input", () => { error.hidden = true; });
    toggle.addEventListener("click", () => {
      const visible = password.type === "password";
      password.type = confirmation.type = visible ? "text" : "password";
      toggle.textContent = visible ? "隐藏密码" : "显示密码";
      toggle.setAttribute("aria-pressed", String(visible));
    });

    async function post(body) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST", credentials: "same-origin", cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body), signal: controller.signal,
        });
        const data = await response.json();
        if (!response.ok || data.ok !== true) {
          if (data.restart === true) stop(data.title || "重置链接已失效", data.message || "请重新申请重置邮件。");
          throw new Error(data.message || "暂时无法完成修改，请稍后重试。");
        }
        return data;
      } finally { clearTimeout(timer); }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      error.hidden = true;
      if ([...password.value].length < 8 || [...password.value].length > 128) {
        showError("密码需要 8–128 位。"); password.focus(); return;
      }
      if (password.value !== confirmation.value) {
        showError("两次密码不一致，请重新确认。"); confirmation.focus(); return;
      }
      busy = true;
      submit.disabled = password.disabled = confirmation.disabled = toggle.disabled = true;
      submit.textContent = "正在修改…";
      result.setAttribute("aria-busy", "true");
      try {
        if (!verified) {
          await post({ action: "verify", type: action, token_hash: tokenHash, access_token: legacyToken });
          verified = true;
          tokenHash = legacyToken = "";
        }
        await post({ action: "update", password: password.value, password_confirmation: confirmation.value });
        password.value = confirmation.value = "";
        verified = false;
        result.dataset.state = "success";
        stop("密码修改成功", "请返回网站，使用新密码登录。");
      } catch (reason) {
        showError(reason.name === "AbortError" || reason instanceof TypeError
          ? "网络连接中断，暂时无法确认修改结果。请稍后重试；如果提示密码相同，可尝试使用新密码登录。"
          : reason.message);
      } finally {
        busy = false;
        submit.disabled = password.disabled = confirmation.disabled = toggle.disabled = false;
        submit.textContent = "确认修改密码";
        result.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
