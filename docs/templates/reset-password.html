<!doctype html>
<html lang="zh-CN">
<body style="font-family:Arial,sans-serif;line-height:1.8;color:#1f2937">
  <h2>重置你的 PosterFlow AI 密码</h2>
  <p>我们收到了重置密码的申请。请点击下面的按钮，在打开的页面中设置新密码。</p>
  <p><a href="{{ .SiteURL }}/api/auth/reset-password#token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:12px 20px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px">设置新密码</a></p>
  <p>如果按钮无法打开，请复制下面的完整链接到系统浏览器：</p>
  <p style="word-break:break-all">{{ .SiteURL }}/api/auth/reset-password#token_hash={{ .TokenHash }}&amp;type=recovery</p>
  <p>修改完成后，页面会明确显示结果。链接仅供本次重置使用，请勿转发。</p>
  <p>如果这不是你的操作，可以忽略此邮件，原密码不会因此改变。</p>
</body>
</html>
